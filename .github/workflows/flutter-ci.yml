name: Flutter CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-android:
    name: Quality and Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cotravel-android-debug-qa
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: cotravel-test-coverage
          path: coverage/lcov.info
          retention-days: 14

  ios:
    name: iOS debug build
    runs-on: macos-latest
    timeout-minutes: 30
    needs: quality-and-android

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without signing
        run: flutter build ios --debug --no-codesign

      - name: Upload unsigned iOS inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: cotravel-ios-unsigned-inspection-only
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
